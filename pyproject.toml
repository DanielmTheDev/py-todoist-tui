[project]
name = "todoist-tui"
version = "0.0.0"
description = "Rich, keyboard-driven Todoist TUI"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
]

[project.scripts]
todoist-tui = "todoist_tui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "pyright>=1.1",
    "import-linter>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todoist_tui"]

[tool.pytest.ini_options]
addopts = "-m 'not smoke' --cov=todoist_tui --cov-report=term-missing"
markers = ["smoke: opt-in tests that hit the live Todoist API (excluded by default)"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["›"]  # hierarchy separator in the arrange status line

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.importlinter]
root_package = "todoist_tui"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (higher may import lower only)"
type = "layers"
layers = [
    "todoist_tui.tui",
    "todoist_tui.application",
    "todoist_tui.api | todoist_tui.store",
    "todoist_tui.domain",
]

[[tool.importlinter.contracts]]
name = "TUI has no direct I/O (must go through application)"
type = "forbidden"
source_modules = ["todoist_tui.tui"]
forbidden_modules = ["todoist_tui.api", "todoist_tui.store", "httpx", "sqlite3"]
